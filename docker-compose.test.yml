version: '3.8'

services:
  cost-guard-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: cost_guard_test_container
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=testpass
    volumes:
      - test_data:/var/lib/postgresql/data
    # Container will run tests and exit automatically
    restart: "no"

volumes:
  test_data:
